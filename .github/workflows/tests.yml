name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check --select E4,E7,E9,F,B app.py kavach_utils.py kavach_schema.py test_gemini.py tests

      - name: Security static analysis
        run: python -m bandit -q -r app.py kavach_utils.py kavach_schema.py test_gemini.py

      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q app.py kavach_utils.py kavach_schema.py test_gemini.py tests

      - name: Run unit tests
        run: python -m pytest -q
