name: Build, quality, and security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    env:
      # Configure GEMINI_MODEL under repository Variables to override this default.
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      # An empty value is safe when a forked PR has no access to repository secrets.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check --select E4,E7,E9,F,B app.py kavach_utils.py kavach_schema.py test_gemini.py tests

      - name: Security static analysis
        run: python -m bandit -q -r app.py kavach_utils.py kavach_schema.py test_gemini.py

      - name: Audit application dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q app.py kavach_utils.py kavach_schema.py test_gemini.py tests

      - name: Run unit tests
        run: python -m pytest -q

      - name: Test live Gemini API connection
        if: ${{ env.GEMINI_API_KEY != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
        run: python test_gemini.py

      - name: Explain skipped live API test
        if: ${{ env.GEMINI_API_KEY == '' }}
        run: echo "GEMINI_API_KEY is not configured for this workflow run; live API smoke test skipped."

      - name: Build deployable container
        run: docker build --tag kavach1930:ci .

